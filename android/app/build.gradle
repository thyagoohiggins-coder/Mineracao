plugins {
    id 'com.android.application'
}

// ---------- Assinatura ----------
// A MESMA chave precisa assinar todas as versões, senão o Android recusa a atualização por cima.
// No GitHub Actions a chave vem dos Secrets (ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD).
// Localmente: ./gradlew assembleRelease -PkeystoreFile=/caminho/estudosplus.jks -PkeystorePassword=...
def keystorePath = System.getenv('ANDROID_KEYSTORE_FILE') ?: project.findProperty('keystoreFile')
def keystorePassword = System.getenv('ANDROID_KEYSTORE_PASSWORD') ?: project.findProperty('keystorePassword')
def keyAliasName = System.getenv('ANDROID_KEY_ALIAS') ?: (project.findProperty('keyAlias') ?: 'estudosplus')
def hasReleaseKey = keystorePath && keystorePassword && file(keystorePath).exists()

// Cada build do GitHub Actions ganha um número de versão maior (exigência para atualizar por cima)
def buildNumber = (System.getenv('GITHUB_RUN_NUMBER') ?: '0') as int

android {
    namespace 'com.estudosplus.app'
    compileSdk 36

    defaultConfig {
        applicationId 'com.estudosplus.app'
        minSdk 26
        targetSdk 36
        versionCode 100 + buildNumber
        versionName "1.2.${buildNumber}"

        // Servidor de sincronização (Cloudflare Worker). Fixo e invisível para o usuário.
        def serverUrl = project.findProperty('serverUrl') ?: 'https://cinefrases.thyagohikins.workers.dev'
        buildConfigField 'String', 'SERVER_URL', "\"${serverUrl}\""
    }

    signingConfigs {
        release {
            if (hasReleaseKey) {
                storeFile file(keystorePath)
                storePassword keystorePassword
                keyAlias keyAliasName
                keyPassword keystorePassword
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig hasReleaseKey ? signingConfigs.release : signingConfigs.debug
        }
        debug {
            if (hasReleaseKey) signingConfig signingConfigs.release
        }
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    applicationVariants.configureEach { variant ->
        variant.outputs.configureEach {
            outputFileName = "EstudosPlus-${variant.versionName}${variant.buildType.name == 'release' ? '' : '-' + variant.buildType.name}.apk"
        }
    }
}

if (!hasReleaseKey) {
    logger.warn('AVISO: chave de assinatura não configurada — o APK usará uma chave temporária e NÃO poderá atualizar uma versão já instalada.')
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'androidx.activity:activity:1.9.3'
    implementation 'androidx.core:core:1.13.1'
    implementation 'androidx.exifinterface:exifinterface:1.3.7'

    // Leitor de imagens: reconhecimento de texto (OCR) no próprio aparelho, sem internet.
    // Modelo embutido no APK (funciona mesmo sem Google Play Services).
    implementation 'com.google.mlkit:text-recognition:16.0.1'
}
