plugins {
    id 'com.android.application'
}

android {
    namespace 'com.cinefrases.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.cinefrases.app'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '1.1.0'

        // Servidor de sincronização (Cloudflare Worker). Fixo e invisível para o usuário.
        def serverUrl = project.findProperty('serverUrl') ?: 'https://cinefrases.thyagohikins.workers.dev'
        buildConfigField 'String', 'SERVER_URL', "\"${serverUrl}\""
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
}
