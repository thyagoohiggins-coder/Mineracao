<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="color-scheme" content="light dark">
  <title>Estudos Plus</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="i-phone" viewBox="0 0 24 24"><path d="M17 1.01 7 1a2 2 0 0 0-2 2v18a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V3a2 2 0 0 0-2-1.99zM17 19H7V5h10v14z"/></symbol>
    <symbol id="i-back" viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></symbol>
    <symbol id="i-copy" viewBox="0 0 24 24"><path d="M16 1H4a2 2 0 0 0-2 2v14h2V3h12V1zm3 4H8a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h11a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2zm0 16H8V7h11v14z"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="M9 16.2 4.8 12l-1.4 1.4L9 19 21 7l-1.4-1.4z"/></symbol>
  </svg>

  <header class="top">
    <img src="icons/logo.svg" alt="" width="28" height="28">
    <h1>Estudos Plus</h1>
    <span id="status" class="dot" title="…"></span>
    <button id="openConnect" class="icon" title="Conectar o app do celular" aria-label="Conectar o app do celular">
      <svg><use href="#i-phone"/></svg>
    </button>
  </header>

  <!-- Tela principal: frases -->
  <main id="home">
    <ul id="list"></ul>
    <p id="pending" class="pending" hidden></p>
  </main>

  <!-- Tela secundária: conectar o app -->
  <section id="connect" hidden>
    <button id="closeConnect" class="link"><svg><use href="#i-back"/></svg>Voltar</button>
    <h2>Conectar o app do celular</h2>
    <p class="muted">No app Estudos Plus, digite este código:</p>
    <div id="codeView">
      <div class="code-row">
        <code id="code">…</code>
        <button id="copyCode" class="btn" title="Copiar código"><svg><use href="#i-copy"/></svg><span>Copiar</span></button>
      </div>
      <button id="editCode" class="link small">Usar outro código</button>
    </div>
    <form id="codeEdit" hidden>
      <input id="codeInput" placeholder="ex.: lua-7K2Q9P" autocomplete="off" spellcheck="false" maxlength="64">
      <p class="error" id="codeError" hidden>Use de 4 a 64 letras, números, “-” ou “_”.</p>
      <div class="row">
        <button type="button" id="genCode" class="btn">Gerar novo</button>
        <span class="grow"></span>
        <button type="button" id="cancelEdit" class="btn ghost">Cancelar</button>
        <button type="submit" class="btn solid">Salvar</button>
      </div>
    </form>
  </section>

  <footer>
    <div class="toggles">
      <label class="switch" id="siteRow" hidden><input type="checkbox" id="siteEnabled"><span class="track"></span><span>Ativa em <b id="siteHost"></b></span></label>
      <label class="switch"><input type="checkbox" id="showButton"><span class="track"></span><span>Botão no vídeo</span></label>
    </div>
    <p class="keys"><kbd>Alt</kbd><kbd>C</kbd> salvar frase <span>·</span> <kbd>Alt</kbd><kbd>X</kbd> últimas falas</p>
  </footer>

  <script src="config.js"></script>
  <script src="sites.js"></script>
  <script src="popup.js"></script>
</body>
</html>
