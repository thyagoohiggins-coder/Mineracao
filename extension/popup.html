<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>CineFrases</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <img src="icons/icon48.png" alt="" width="28" height="28">
    <h1>CineFrases</h1>
    <span id="status" class="status" title="Status da sincronização"><i></i><b>…</b></span>
  </header>

  <section class="card">
    <label>Código de sincronização
      <div class="row">
        <input id="code" placeholder="ex.: lua-7K2Q9P" autocomplete="off" spellcheck="false">
        <button id="gen" class="ghost" title="Gerar um código novo">Gerar</button>
      </div>
    </label>
    <small>Use o mesmo código no app Android para os dois ficarem sincronizados.</small>

    <details>
      <summary>Servidor</summary>
      <label>Endereço do servidor
        <input id="server" placeholder="https://cinefrases.SEU-USUARIO.workers.dev" spellcheck="false">
      </label>
      <small>O endereço do seu Worker na Cloudflare (aparece ao rodar <b>npm run deploy</b>).</small>
    </details>

    <div class="row">
      <button id="save">Salvar</button>
    </div>
  </section>

  <section class="toggles">
    <label class="switch"><input type="checkbox" id="enabled"> <span>Extensão ativa</span></label>
    <label class="switch"><input type="checkbox" id="showButton"> <span>Mostrar botão sobre o vídeo</span></label>
  </section>

  <section>
    <h2>Últimas frases <span id="pending" class="pending" hidden></span></h2>
    <ul id="list"></ul>
  </section>

  <footer><kbd>Alt</kbd>+<kbd>C</kbd> copia a frase da tela · <kbd>Alt</kbd>+<kbd>X</kbd> mostra as últimas falas</footer>
  <script src="config.js"></script>
  <script src="popup.js"></script>
</body>
</html>
