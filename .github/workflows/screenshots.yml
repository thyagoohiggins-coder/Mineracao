name: Prints do app

on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/screenshots.yml'
      - '.github/scripts/**'

permissions:
  contents: write   # para salvar os prints em docs/prints

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: gradle/actions/setup-gradle@v4

      - name: Compilar APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew --no-daemon assembleDebug

      - name: Subir servidor com frases de exemplo
        run: |
          (cd server && DATA_FILE=/tmp/db.json nohup node server.js > /tmp/server.log 2>&1 &)
          for i in $(seq 30); do curl -fs localhost:3000/api/health && break; sleep 1; done
          .github/scripts/seed.sh

      - name: Habilitar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Emulador + prints
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: bash .github/scripts/screenshots.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prints-do-app
          path: docs/prints/

      - name: Salvar prints no repositório
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/prints
          git diff --cached --quiet && exit 0
          git commit -m "Prints do app Android (gerados pelo CI) [skip ci]"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
