name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  android:
    name: App Android (APK)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Compilar APK de debug
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: CineFrases-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

  server:
    name: Servidor (testes)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test

  extension:
    name: Extensão (pacote .zip)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validar e empacotar
        run: |
          node -e "JSON.parse(require('fs').readFileSync('extension/manifest.json','utf8'))"
          for f in extension/*.js; do node --check "$f"; done
          cd extension && zip -r ../CineFrases-extensao.zip . -x '*.DS_Store'
      - uses: actions/upload-artifact@v4
        with:
          name: CineFrases-extensao
          path: CineFrases-extensao.zip
