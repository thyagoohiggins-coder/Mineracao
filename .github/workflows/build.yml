name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  android:
    name: App Android (APK)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Chave de assinatura (Secrets)
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/estudosplus.jks"
            echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/estudosplus.jks" >> "$GITHUB_ENV"
            echo "Chave de assinatura carregada."
          else
            echo "::warning title=APK sem chave fixa::Configure os secrets ANDROID_KEYSTORE_BASE64 e ANDROID_KEYSTORE_PASSWORD. Sem eles o APK não consegue atualizar uma versão já instalada."
          fi
      - name: Compilar APK (release)
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          ls -la app/build/outputs/apk/release/
      - name: Conferir assinatura
        continue-on-error: true
        run: |
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner
          for apk in app/build/outputs/apk/release/*.apk; do
            echo "== $apk"
            "$APKSIGNER" verify --print-certs "$apk" | grep -i "certificate" || true
          done
      - uses: actions/upload-artifact@v4
        with:
          name: EstudosPlus-apk
          path: android/app/build/outputs/apk/release/*.apk

  server:
    name: Servidor (testes)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test

  cloudflare:
    name: Servidor Cloudflare (testes)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudflare
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm test

  extension:
    name: Extensão (pacote .zip)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validar e empacotar
        run: |
          node -e "JSON.parse(require('fs').readFileSync('extension/manifest.json','utf8'))"
          for f in extension/*.js; do node --check "$f"; done
          cd extension && zip -r ../EstudosPlus-extensao.zip . -x '*.DS_Store'
      - uses: actions/upload-artifact@v4
        with:
          name: EstudosPlus-extensao
          path: EstudosPlus-extensao.zip
